<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 98" width="70" height="98">
  <defs>
    <pattern id="dots" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.2" fill="rgba(255,255,255,0.22)"/>
    </pattern>
    <clipPath id="card">
      <rect x="2" y="2" width="66" height="94" rx="5" ry="5"/>
