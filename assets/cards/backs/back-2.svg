  <rect x="1" y="1" width="68" height="96" rx="6" ry="6" fill="#0d2b6b" stroke="#071a44" stroke-width="1.5"/>
  <rect x="3" y="3" width="64" height="92" rx="4" ry="4" fill="url(#dots)" clip-path="url(#card)"/>
  <rect x="3" y="3" width="64" height="92" rx="4" ry="4" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="35" y="55" font-family="serif" font-size="18" text-anchor="middle" fill="rgba(255,255,255,0.12)" font-weight="bold">★</text>
