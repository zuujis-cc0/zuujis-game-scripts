<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 98" width="70" height="98">
  <defs>
    <pattern id="diamond" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <polygon points="5,0 10,5 5,10 0,5" fill="none" stroke="#c0392b" stroke-width="0.8" opacity="0.7"/>
    </pattern>
    <clipPath id="card">
      <rect x="2" y="2" width="66" height="94" rx="5" ry="5"/>
    </clipPath>
  </defs>
  <rect x="1" y="1" width="68" height="96" rx="6" ry="6" fill="#8b0000" stroke="#5a0000" stroke-width="1.5"/>
  <rect x="3" y="3" width="64" height="92" rx="4" ry="4" fill="url(#diamond)" clip-path="url(#card)"/>
  <rect x="3" y="3" width="64" height="92" rx="4" ry="4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="35" y="55" font-family="serif" font-size="18" text-anchor="middle" fill="rgba(255,255,255,0.15)" font-weight="bold">♦</text>
</svg>
