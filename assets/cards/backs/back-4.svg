<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 98" width="70" height="98">
  <defs>
    <pattern id="stars" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <text x="7" y="10" font-family="serif" font-size="9" text-anchor="middle" fill="rgba(255,255,255,0.2)">✦</text>
    </pattern>
    <clipPath id="card">
      <rect x="2" y="2" width="66" height="94" rx="5" ry="5"/>
    </clipPath>
  </defs>
  <rect x="1" y="1" width="68" height="96" rx="6" ry="6" fill="#3b0764" stroke="#22044a" stroke-width="1.5"/>
  <rect x="3" y="3" width="64" height="92" rx="4" ry="4" fill="url(#stars)" clip-path="url(#card)"/>
  <rect x="3" y="3" width="64" height="92" rx="4" ry="4" fill="none" stroke="rgba(200,150,255,0.25)" stroke-width="1"/>
  <text x="35" y="55" font-family="serif" font-size="18" text-anchor="middle" fill="rgba(200,150,255,0.12)" font-weight="bold">♠</text>
</svg>
