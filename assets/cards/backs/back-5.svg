<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 98" width="70" height="98">
  <defs>
    <pattern id="carbon" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="4" fill="rgba(255,255,255,0.07)"/>
      <rect x="4" y="4" width="4" height="4" fill="rgba(255,255,255,0.07)"/>
      <rect x="0" y="0" width="8" height="8" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
    </pattern>
    <clipPath id="card">
      <rect x="2" y="2" width="66" height="94" rx="5" ry="5"/>
    </clipPath>
  </defs>
  <rect x="1" y="1" width="68" height="96" rx="6" ry="6" fill="#1c1c1e" stroke="#111" stroke-width="1.5"/>
  <rect x="3" y="3" width="64" height="92" rx="4" ry="4" fill="url(#carbon)" clip-path="url(#card)"/>
  <rect x="3" y="3" width="64" height="92" rx="4" ry="4" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="35" y="55" font-family="serif" font-size="18" text-anchor="middle" fill="rgba(255,255,255,0.08)" font-weight="bold">◆</text>
</svg>
