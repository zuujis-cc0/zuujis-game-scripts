<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 98" width="70" height="98">
  <defs>
    <pattern id="constellation" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1" fill="rgba(255,255,255,0.4)"/>
      <circle cx="14" cy="9" r="0.7" fill="rgba(255,255,255,0.3)"/>
      <circle cx="8" cy="16" r="1.1" fill="rgba(255,255,255,0.35)"/>
      <circle cx="18" cy="18" r="0.6" fill="rgba(255,255,255,0.25)"/>
      <line x1="3" y1="4" x2="14" y2="9" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
      <line x1="14" y1="9" x2="8" y2="16" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
      <line x1="8" y1="16" x2="18" y2="18" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    </pattern>
    <clipPath id="card">
      <rect x="2" y="2" width="66" height="94" rx="5" ry="5"/>
