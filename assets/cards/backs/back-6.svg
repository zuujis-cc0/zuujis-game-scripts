  <rect x="1" y="1" width="68" height="96" rx="6" ry="6" fill="#05112b" stroke="#020b1a" stroke-width="1.5"/>
  <rect x="3" y="3" width="64" height="92" rx="4" ry="4" fill="url(#constellation)" clip-path="url(#card)"/>
  <rect x="3" y="3" width="64" height="92" rx="4" ry="4" fill="none" stroke="rgba(100,160,255,0.2)" stroke-width="1"/>
  <text x="35" y="55" font-family="serif" font-size="18" text-anchor="middle" fill="rgba(100,160,255,0.12)" font-weight="bold">✦</text>
</svg>
